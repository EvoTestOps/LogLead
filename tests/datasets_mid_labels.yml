root_folder: '~/Datasets'

datasets:
  - name: bgl
    url: https://zenodo.org/records/8196385/files/BGL.zip?download=1
    log_file: BGL.log
    download: true
    load: true
    enhance: true
    anomaly_detection: true
    predictor_cols:
      numeric: [e_words_len, e_alphanumerics_len]
      categorical: [type, level, component]   # BGL's own fields; F1 0.844 with no message text
    expected_length: 4747963
    reduction_fraction: 0.02
  - name: hadoop
    url: https://zenodo.org/records/8196385/files/Hadoop.zip?download=1
    filename_pattern: "*.log"
    labels_file: abnormal_label.txt
    download: true
    load: true
    enhance: true
    anomaly_detection: true
    predictor_cols:
      numeric: [nep_abs_max, nep_prob_nmax_min, eve_len_med, eve_len_max]
      categorical: [app_name]   # NOT Label - that column is the target spelled differently
    expected_length: 180897
    reduction_fraction: 0.56
  - name: hdfs
    url: https://zenodo.org/records/8196385/files/HDFS_v1.zip?download=1
    log_file: HDFS.log
    labels_file: preprocessed/anomaly_label.csv
    download: true
    load: true
    enhance: true
    anomaly_detection: true
    predictor_cols:
      numeric: [nep_abs_max, eve_len_max, eve_len_min, e_event_id_len, eve_len_over1]
      categorical: []           # the sequence frame carries no categorical field of its own
    expected_length: 11175629
    reduction_fraction: 0.01
  - name: nezha
    urls:
      - https://github.com/IntelligentDDS/Nezha/tree/main/construct_data/
      - https://github.com/IntelligentDDS/Nezha/tree/main/rca_data/
    systems:
      - TrainTicket
      - WebShop
    download: true
    load: true
    enhance: true
    anomaly_detection: true
    # One entry serves both TrainTicket and WebShop; all five columns exist in both frames.
    predictor_cols:
      numeric: []
      categorical: [Container, date_folder, severity, Node, PodName]
    train_ticket:
      expected_length: 272270
      reduction_fraction: 0.33
    web_shop:
      expected_length: 3958203
      reduction_fraction: 0.025
  # - name: profilence
  #   log_file: "*.txt"
  #   download: true
  #   load: true
  #   enhance: true 
  #   anomaly_detection: true
  #   expected_length: 5203599
  #   reduction_fraction: 0.02
  - name: adfa
    url: https://github.com/verazuo/a-labelled-version-of-the-ADFA-LD-dataset/raw/master/ADFA-LD.zip
    folder: ADFA-LD
    download: true
    load: true
    enhance: false 
    anomaly_detection: true
    expected_length: 2747550
    reduction_fraction: 0.0364
  - name: awsctd
    url: https://github.com/DjPasco/AWSCTD/raw/master/CSV.7z
    folder: AWSCTD
    download: true
    load: true
    enhance: false 
    anomaly_detection: true
    expected_length: 174847810
    reduction_fraction: 0.0057