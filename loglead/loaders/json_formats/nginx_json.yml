name: nginx_json
description: >
  nginx access log written with the json_logstash log_format. Flat, eight keys, one object per
  request. Note that JSON does not save you from timestamp parsing: the time field is still in
  Apache's own format.

container: ndjson

timestamp_field: time
timestamp_formats:
  - "%d/%b/%Y:%H:%M:%S %z"

# No single key is "the message" in an access log, so render one. response and bytes stay as their
# own Int64 columns for AnomalyDetector(numeric_cols=...) either way.
line_format: "{remote_ip} {request} {response}"

seq_id_field: remote_ip
extra_fields: keep

sample:
  - '{"time": "17/May/2015:08:05:32 +0000", "remote_ip": "93.180.71.3", "remote_user": "-", "request": "GET /downloads/product_1 HTTP/1.1", "response": 304, "bytes": 0, "referrer": "-", "agent": "Debian APT-HTTP/1.3 (0.8.16~exp12ubuntu10.21)"}'
