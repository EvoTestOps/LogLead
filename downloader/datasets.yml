root_folder: '~/Datasets'

# The single source of truth for *downloading* every public dataset LogLead knows about. Besides the
# fields download_data.py reads (name, url/urls, local_archive, source_url, download), each entry
# records facts about the dataset itself, which download_data.py ignores:
#   type            raw (log lines as the system wrote them), parsed-all (parsed into fields with
#                   the full message plus its template/event id), parsed-template-id-only (only an
#                   event id per line, no text) or parsed-template-only (only the template text,
#                   parameters dropped)
#   labels          true / false / partial - whether the published dataset carries anomaly labels
#   labeling_level  line (each log line labelled), sequence (a block, trace, application or test
#                   case labelled as a whole) or time-window (labels are time intervals, which
#                   cover many lines and map to neither); absent when there are no labels
#   paper           BibTeX key(s) in datasets.bib of the paper that introduced the dataset; absent
#                   when none exists
# Loading/enhancing/testing options (log_file, labels_file, format, loader,
# predictor_cols, expected_length, ...) live in the tests/datasets_*.yml configs instead, so this
# file doesn't drift out of sync with them every time a test expectation changes.
#
# tests/datasets_*.yml configs that need one of these datasets under their own root_folder set
# `local_copy_folder: '~/Datasets'` so download_data.py copies it from here instead of
# re-downloading - see download_data.py's copy_local_dataset().

datasets:
  - name: bgl
    type: raw
    labels: true
    labeling_level: line
    paper: oliner2007supercomputers
    url: https://zenodo.org/records/8196385/files/BGL.zip?download=1
    download: true
  - name: hadoop
    type: raw
    labels: true
    labeling_level: sequence
