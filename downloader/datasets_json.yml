root_folder: '~/Datasets_json'


datasets:
  - name: nginx_json
    url: https://raw.githubusercontent.com/elastic/examples/master/Common%20Data%20Formats/nginx_json_logs/nginx_json_logs
    format: ndjson
    log_file: nginx_json_logs
    download: true
    load: false
    enhance: false
    anomaly_detection: false
    expected_length: 51462
    reduction_fraction: 1.0


  - name: security_datasets
    url: https://raw.githubusercontent.com/OTRF/Security-Datasets/master/datasets/atomic/windows/credential_access/host/cmd_lsass_memory_dumpert_syscalls.zip
    format: ndjson
    log_file: cmd_lsass_memory_dumpert_syscalls_2020-10-1822561997.json
    download: true
    load: false
    enhance: false
    anomaly_detection: false
    expected_length: 118
    reduction_fraction: 1.0


  - name: ait_ads
    urls:
      - https://zenodo.org/records/8263181/files/ait_ads.zip?download=1
      - https://zenodo.org/records/8263181/files/labels.csv?download=1
    format: ndjson
    filename_pattern: "*.json"
    labels_file: labels.csv
    download: true
    load: false
    enhance: false
    anomaly_detection: false
    expected_length: 2655821
    reduction_fraction: 0.05
