[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "LogLead"
version = "2.0.0"
authors = [
    {name = "Mika Mäntylä", email="mika.mantyla@helsinki.fi"},
    {name = "Jesse Nyyssölä", email = "jesse.nyyssola@helsinki.fi"},
    {name = "Yuqing Wang", email="yuqing.wang@helsinki.fi"},
    {name = "Alexander Bakhtin", email = "alexander.bakhtin@protonmail.com"}]
maintainers = [
    {name = "Alexander Bakhtin", email = "alexander.bakhtin@protonmail.com"}]
description = "LogLead stands for Log Loader, Enhancer, and Anomaly Detector"
readme = "PYPI_README.md"
license = {file = "LICENSE"}
keywords = [
    "logs",
    "anomaly detection",
    "log parsing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging"]

requires-python = ">=3.10,<3.14"
dependencies = [
# Lower bounds are the oldest releases actually verified against this Python floor, not
# historical minimums: every unbounded dependency below used to resolve to a pre-wheel
# sdist that cannot build on 3.10. Upper bounds guard the majors that have broken us or
# have an unreleased next major - they are lifted deliberately, after a suite run.
"polars[numpy,pandas,pyarrow]>=1.38.1,<2",
"scipy>=1.11",
'regex>=2024.5.15',
'drain3>=0.9.11',
'tipping>=0.2',
"scikit-learn>=1.5,<2",
"xgboost>=2.1,<4",
"python-dotenv>=1.0.1",
"pyyaml>=6.0.1",
"psutil>=5.9.8",
"matplotlib>=3.8",
"requests>=2.32",#downloader
"tqdm>=4.66",#downloader
"GitPython>=3.1.41",#downloader
"py7zr>=0.21",#downloader
"umap-learn>=0.5.6", #delta/visualize
"plotly>=5.19,<7", #delta/visualize
"scikit-optimize>=0.10.2" #f1-score optimzer; 0.10.1 hard-imports check_pandas_support, moved in sklearn 1.5
]

[project.optional-dependencies]
# MCP server: pip install loglead[mcp], then run loglead-mcp
mcp = [
'mcp>=1.9,<3',
"XlsxWriter>=3.2" #xlsx result tables
]

[dependency-groups]
# Not a published extra: iplom-llm-parser has no PyPI release, and PyPI rejects any uploaded
# package whose metadata carries a direct git reference (even inside an extra). This group is
# for local dev only - `uv run --group iplom_llm ...` - not something `pip install` can reach.
iplom_llm = [
    "iplom-llm-parser @ git+https://github.com/EvoTestOps/iplom-llm-parser@v0.1.1 ; python_version >= '3.11'",
]

[project.scripts]
loglead-mcp = "loglead.mcp.server:main"

[project.urls]
Homepage = "https://github.com/EvoTestOps/LogLead"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Format specs read at runtime by JsonLoader(format=...), AccessLogLoader(format=...), and
# DelimitedLoader(format=...). None of these directories has an __init__.py - they are data
# directories, not subpackages - so the patterns are relative to their parent package.
"loglead.loaders" = ["json_formats/*.yml", "access_log_formats/*.yml", "delimited_formats/*.yml"]

[tool.setuptools.packages.find]
include = ["loglead*"]
