root_folder: '~/Datasets'

# The single source of truth for *downloading* every public dataset LogLead knows about. Only the
# fields download_data.py actually reads are here (name, url/urls, local_archive, source_url,
# download) - loading/enhancing/testing options (log_file, labels_file, format, loader,
# predictor_cols, expected_length, ...) live in the tests/datasets_*.yml configs instead, so this
# file doesn't drift out of sync with them every time a test expectation changes.
#
# tests/datasets_*.yml configs that need one of these datasets under their own root_folder set
# `local_copy_folder: '~/Datasets'` so download_data.py copies it from here instead of
# re-downloading - see download_data.py's copy_local_dataset().

datasets:
  - name: bgl
    url: https://zenodo.org/records/8196385/files/BGL.zip?download=1
    download: true
  - name: hadoop
    url: https://zenodo.org/records/8196385/files/Hadoop.zip?download=1
    download: true
  - name: hdfs
    url: https://zenodo.org/records/8196385/files/HDFS_v1.zip?download=1
    download: true
  - name: liberty
    url: http://0b4af6cdc2f0c5998459-c0245c5c937c5dedcca3f1764ecc9b2f.r43.cf2.rackcdn.com/hpc4/liberty2.gz
    download: true
  - name: spirit
    url: http://0b4af6cdc2f0c5998459-c0245c5c937c5dedcca3f1764ecc9b2f.r43.cf2.rackcdn.com/hpc4/spirit2.gz
    download: true
  - name: thunderbird
    url: http://0b4af6cdc2f0c5998459-c0245c5c937c5dedcca3f1764ecc9b2f.r43.cf2.rackcdn.com/hpc4/tbird2.gz
    download: true
  - name: nezha
    urls:
      - https://github.com/IntelligentDDS/Nezha/tree/main/construct_data/
      - https://github.com/IntelligentDDS/Nezha/tree/main/rca_data/
    download: true
  # - name: profilence
  #   download: true
  - name: adfa
    url: https://github.com/verazuo/a-labelled-version-of-the-ADFA-LD-dataset/raw/master/ADFA-LD.zip
    download: true
  - name: awsctd
    url: https://github.com/DjPasco/AWSCTD/raw/master/CSV.7z
    download: true
  - name: nginx_json
    url: https://raw.githubusercontent.com/elastic/examples/master/Common%20Data%20Formats/nginx_json_logs/nginx_json_logs
    download: true
  - name: security_datasets
    url: https://raw.githubusercontent.com/OTRF/Security-Datasets/master/datasets/atomic/windows/credential_access/host/cmd_lsass_memory_dumpert_syscalls.zip
    download: true
  - name: ait_ads
    urls:
      - https://zenodo.org/records/8263181/files/ait_ads.zip?download=1
      - https://zenodo.org/records/8263181/files/labels.csv?download=1
    download: true
  - name: logfmt
    urls:
      - https://raw.githubusercontent.com/grafana/loki/main/pkg/pattern/drain/testdata/grafana-ruler.txt
      - https://raw.githubusercontent.com/grafana/loki/main/pkg/pattern/drain/testdata/agent-logfmt.txt
      - https://raw.githubusercontent.com/grafana/loki/main/pkg/pattern/drain/testdata/distributor-logfmt.txt
      - https://raw.githubusercontent.com/grafana/loki/main/pkg/pattern/drain/testdata/ingester-logfmt.txt
    download: true
  - name: syslog
    urls:
      - https://zenodo.org/records/8196385/files/Linux.tar.gz?download=1
      - https://zenodo.org/records/8196385/files/Mac.tar.gz?download=1
      - https://zenodo.org/records/8196385/files/SSH.tar.gz?download=1
    download: true
  - name: access_log
    local_archive: '~/kaggle/archive.zip'
    source_url: https://www.kaggle.com/datasets/eliasdabbas/web-server-access-logs
    download: true
