root_folder: '~/Datasets_json'
local_copy_folder: '~/Datasets'

# predictor_cols pins the columns the structured-column anomaly test predicts from; omit it and
# tests/anomaly_detectors.py falls back to loglead.select_predictors(). See
# tests/datasets_mid_labels.yml for why pinning is worth it. Pinning matters more here than for the
# fixed-schema datasets: JSON keys
# vary per record, so what auto-selection finds shifts with whichever records happen to be present.
# All three are unlabeled, so these columns are scored unsupervised, never evaluated.
#
# file_name is deliberately absent everywhere. It is provenance, not something the log said, and
# these archives put one scenario per file - on ait_ads it is the only categorical column that
# survives profiling, which makes it exactly the trap it was on Nezha.



datasets:
  - name: nginx_json
    url: https://raw.githubusercontent.com/elastic/examples/master/Common%20Data%20Formats/nginx_json_logs/nginx_json_logs
    format: ndjson
    log_file: nginx_json_logs
    download: true
    load: true
    enhance: true
    anomaly_detection: true
    predictor_cols:
      numeric: [response, e_words_len, e_alphanumerics_len, e_chars_len]
      categorical: [request]    # remote_user is constant, referrer 99.97% one value, time an id
    expected_length: 51462
    reduction_fraction: 1.0


  - name: security_datasets
    url: https://raw.githubusercontent.com/OTRF/Security-Datasets/master/datasets/atomic/windows/credential_access/host/cmd_lsass_memory_dumpert_syscalls.zip
    format: ndjson
    log_file: cmd_lsass_memory_dumpert_syscalls_2020-10-1822561997.json
    download: true
    load: true
    enhance: true
    anomaly_detection: true
    predictor_cols:
      numeric: [e_lines_len, EventID]
      categorical: [Channel, SourceName, Task]   # the 7 keys every OTRF record carries
    expected_length: 118
    reduction_fraction: 1.0


  - name: ait_ads
    urls:
      - https://zenodo.org/records/8263181/files/ait_ads.zip?download=1
      - https://zenodo.org/records/8263181/files/labels.csv?download=1
    format: ndjson
    filename_pattern: "*.json"
    labels_file: labels.csv
    download: true
    load: true
    enhance: true
    anomaly_detection: true
    predictor_cols:
      numeric: [e_lines_len, e_words_len, e_alphanumerics_len, e_chars_len, e_trigrams_len]
      categorical: []           # 102 of 157 columns are >50% null, the rest nested or provenance
    expected_length: 2655821
    reduction_fraction: 0.05
