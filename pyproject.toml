[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "LogLead"
version = "1.2.3"
authors = [
    {name = "Mika Mäntylä", email="mika.mantyla@helsinki.fi"},
    {name = "Jesse Nyyssölä", email = "jesse.nyyssola@helsinki.fi"},
    {name = "Yuqing Wang", email="yuqing.wang@helsinki.fi"},
    {name = "Alexander Bakhtin", email = "alexander.bakhtin@protonmail.com"}]
maintainers = [
    {name = "Alexander Bakhtin", email = "alexander.bakhtin@protonmail.com"}]
description = "LogLead stands for Log Loader, Enhancer, and Anomaly Detector"
readme = "PYPI_README.md"
license = {file = "LICENSE"}
keywords = [
    "logs",
    "anomaly detection",
    "log parsing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging"]

requires-python = ">=3.9,<3.13"
dependencies = [
"polars[numpy,pandas,pyarrow]>=1.5.0,<1.39.0",
"scipy>=1.10.1",
'regex>=2023.10.3',
'drain3>=0.9.11',
'tipping>=0.1.3',
"scikit-learn>=1.2.2",
"xgboost>=1.7.3",
"python-dotenv>=1.0.1",
"pyyaml",
"psutil",
"jinja2",
"matplotlib",
"requests",#downloader
"tqdm",#downloader
"GitPython",#downloader
"py7zr",#downloader
"shap>=0.42.1", #explainer
"umap-learn>=0.5.6", #explainer
"plotly>=5.19.0", #explainer
"nbformat>=4.2.0", #explainer
"scikit-optimize>=0.10.1" #f1-score optimzer
]

[project.optional-dependencies]
# MCP server: pip install loglead[mcp], then run loglead-mcp
# The MCP SDK needs Python 3.10+, while LogLead itself still supports 3.9,
# so the marker keeps `pip install loglead` resolvable on 3.9.
mcp = [
'mcp[cli]>=1.9; python_version >= "3.10"',
"XlsxWriter>=3.2" #xlsx result tables
]
iplom_llm = [
    "iplom-llm-parser @ git+https://github.com/EvoTestOps/iplom-llm-parser@v0.1.1 ; python_version >= '3.11'",
]

[project.scripts]
loglead-mcp = "loglead.mcp.server:main"

[project.urls]
Homepage = "https://github.com/EvoTestOps/LogLead"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Format specs read at runtime by JsonLoader(format=...) and AccessLogLoader(format=...). Neither
# directory has an __init__.py - they are data directories, not subpackages - so the patterns are
# relative to their parent package.
"loglead.loaders" = ["json_formats/*.yml", "access_log_formats/*.yml"]

[tool.setuptools.packages.find]
include = ["loglead*"]
